name: Build and publish DCC Web image

on:
  push:
    branches:
      - "codex/dcc-web-*"
    tags:
      - "dcc-web-v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs before building
        shell: bash
        run: |
          version="$(tr -d '\r\n' < apps/dcc-web/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" == "dcc-web-v$version" ]]
          fi
          test -s "apps/dcc-web/RELEASE_NOTES_${version}.md"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Web dependencies and run tests
        run: |
          python -m pip install --disable-pip-version-check -r apps/dcc-web/requirements.txt
          python -m compileall -q apps/dcc-web
          python -m unittest discover -s tests -p test_catalog_identity.py -v
          python -m unittest discover -s tests -p test_catalog_maintenance.py -v
          python -m unittest discover -s apps/dcc-web/tests -v
          node apps/dcc-web/tests/frontend_unit.mjs
      - name: Verify the downloadable source package
        run: |
          python packaging/web/build_source_archive.py
          asset="release/DCC-Web-$(tr -d '\r\n' < apps/dcc-web/VERSION)-source.zip"
          python -m zipfile -t "$asset"
      - name: Verify panel gateway and Container Updater rendering in Chromium
        timeout-minutes: 8
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r apps/container-updater/requirements.txt
          npm install --prefix "$RUNNER_TEMP/dcc-browser" --no-save playwright@1.58.2
          "$RUNNER_TEMP/dcc-browser/node_modules/.bin/playwright" install --with-deps chromium
          python apps/dcc-web/tests/panel_browser_fixture.py --updater > "$RUNNER_TEMP/dcc-updater-fixture.log" 2>&1 &
          updater_pid=$!
          python apps/dcc-web/tests/panel_browser_fixture.py > "$RUNNER_TEMP/dcc-web-fixture.log" 2>&1 &
          web_pid=$!
          trap 'status=$?; kill "$web_pid" "$updater_pid" 2>/dev/null || true; if ((status)); then tail -n 80 "$RUNNER_TEMP"/dcc-*-fixture.log; fi' EXIT
          NODE_PATH="$RUNNER_TEMP/dcc-browser/node_modules" node apps/dcc-web/tests/run_panel_browser_smoke.cjs
      - name: Validate the multi-architecture image and socket permissions
        run: |
          docker build -f apps/dcc-web/Dockerfile -t dcc-web:release-candidate .
          docker run --rm --cap-drop=ALL --cap-add=SETUID --cap-add=SETGID --security-opt=no-new-privileges:true --volume /var/run/docker.sock:/var/run/docker.sock dcc-web:release-candidate python -c 'import os,subprocess; assert os.geteuid()==10001, os.geteuid(); assert os.access("/var/run/docker.sock",os.R_OK|os.W_OK); subprocess.run(["docker","version","--format","{{.Server.Version}}"],check=True,capture_output=True,text=True); subprocess.run(["docker","compose","version"],check=True,capture_output=True,text=True); print("socket group, dropped UID and Compose OK")'
          docker run --rm dcc-web:release-candidate --self-check
          python apps/dcc-web/tests/docker_security_smoke.py --image dcc-web:release-candidate
          python apps/dcc-web/tests/docker_remote_access_smoke.py --image dcc-web:release-candidate
          python apps/container-updater/tests/docker_web_https_smoke.py \
            --old-image ghcr.io/hattimon/dcc-web:0.2.2 --target-image dcc-web:release-candidate \
            --expected-version "$(cat apps/dcc-web/VERSION)" --local-target --expect-remote-access
          python apps/container-updater/tests/docker_web_https_smoke.py \
            --target-image dcc-web:release-candidate --expected-version "$(cat apps/dcc-web/VERSION)" \
            --local-target --with-tunnel-resume
      - name: Upgrade published Web 0.3.1 with Updater, preserve a running project and open its panel
        run: |
          version="$(tr -d '\r\n' < apps/dcc-web/VERSION)"
          target="ghcr.io/hattimon/dcc-web:$version"
          docker tag dcc-web:release-candidate "$target"
          python apps/container-updater/tests/docker_web_https_smoke.py \
            --old-image ghcr.io/hattimon/dcc-web:0.3.1 --target-image "$target" \
            --expected-version "$version" --local-target --expect-remote-access --verify-release-candidate

  publish:
    if: startsWith(github.ref, 'refs/tags/dcc-web-v')
    needs: verify
    permissions:
      actions: write
      contents: write
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read and check the Web version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < apps/dcc-web/VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${GITHUB_REF_NAME#dcc-web-v}" == "$VERSION" ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tags
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hattimon/dcc-web
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=DCC Web
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/hattimon/DCC/tree/${{ github.ref_name }}/apps/dcc-web
      - name: Build and publish Linux amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/dcc-web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=dcc-web
          cache-to: type=gha,mode=max,scope=dcc-web
      - name: Verify anonymous image access
        run: |
          # The source label links this package to the public repository, so GHCR inherits its visibility.
          docker logout ghcr.io
          docker manifest inspect "ghcr.io/hattimon/dcc-web:${{ steps.version.outputs.version }}" >/dev/null
          echo "The public App Store tag is readable without credentials."
      - name: Set up Python for source packaging
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package the source archive
        run: |
          python packaging/web/build_source_archive.py
          cd release
          asset="DCC-Web-${{ steps.version.outputs.version }}-source.zip"
          python -m zipfile -t "$asset"
          sha256sum "$asset" > "$asset.sha256"
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          asset="release/DCC-Web-${{ steps.version.outputs.version }}-source.zip"
          notes="apps/dcc-web/RELEASE_NOTES_${{ steps.version.outputs.version }}.md"
          tag="$GITHUB_REF_NAME"
          test -f "$notes"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "DCC Web ${{ steps.version.outputs.version }}" \
              --notes-file "$notes"
            gh release upload "$tag" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY" \
              --title "DCC Web ${{ steps.version.outputs.version }}" \
              --latest=false \
              --notes-file "$notes"
          fi
      - name: Refresh the official App Store catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run catalog-maintenance.yml --repo "$GITHUB_REPOSITORY" --ref main
