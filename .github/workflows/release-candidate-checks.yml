name: DCC release candidate checks

on:
  push:
    branches:
      - "codex/desktop-web-*"
    paths:
      - "DockerControlCenter.py"
      - "DockerControlCenter.nsi"
      - "dcc-catalog.json"
      - "dcc_catalog.py"
      - "apps/dcc-web/**"
      - "packaging/**"
      - "release/**"
      - "tests/**"
      - ".github/workflows/release-candidate-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "DockerControlCenter.py"
      - "DockerControlCenter.nsi"
      - "dcc-catalog.json"
      - "dcc_catalog.py"
      - "apps/dcc-web/**"
      - "packaging/**"
      - "release/**"
      - "tests/**"
      - ".github/workflows/release-candidate-checks.yml"

permissions:
  contents: read

jobs:
  windows-upgrade:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and build dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress
      - name: Run Desktop tests
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build Windows installer
        shell: powershell
        run: |
          $env:DCC_BUILD_PYTHON = (Get-Command python).Source
          .\packaging\windows\build_installer.ps1
      - name: Upgrade v1.3.11 to the candidate in an isolated runner profile
        shell: powershell
        run: .\tests\windows_installer_upgrade_smoke.ps1 -CandidateInstaller .\release\DockerControlCenter-Setup-1.3.12.exe
      - name: Upload tested Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: dcc-v1.3.12-windows
          path: release/DockerControlCenter-Setup-1.3.12.exe
          if-no-files-found: error

  debian-upgrade:
    # Build on the oldest supported Ubuntu LTS so the bundled ELF runtime
    # remains usable on newer Debian-family systems such as MX Linux.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv desktop-file-utils xvfb xauth libgl1 libegl1 libdbus-1-3 libfontconfig1 libx11-6 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0 libpulse0 pkexec openssh-client xdg-utils
      - name: Build Debian package
        env:
          PYTHON_BIN: python
        run: bash packaging/linux/build_deb.sh
      - name: Upgrade v1.3.11, verify desktop launch and compare user data
        run: bash tests/linux_deb_upgrade_smoke.sh
      - name: Upload tested Linux package
        uses: actions/upload-artifact@v4
        with:
          name: dcc-v1.3.12-linux
          path: release/DockerControlCenter_1.3.12_amd64.deb
          if-no-files-found: error

  debian-stable-compatibility:
    needs: debian-upgrade
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4
      - name: Download the tested Debian package
        uses: actions/download-artifact@v4
        with:
          name: dcc-v1.3.12-linux
          path: release
      - name: Install and launch on current Debian stable (MX Linux base)
        run: |
          apt-get update
          apt-get install -y ca-certificates curl desktop-file-utils xvfb xauth fonts-dejavu-core
          bash tests/linux_deb_compat_smoke.sh release/DockerControlCenter_1.3.12_amd64.deb

  debian-bookworm-upgrade-compatibility:
    # The previous v1.3.10 package depends on policykit-1, which is available
    # on Bookworm. Test the real apt-based upgrade on that supported base;
    # Trixie's fresh install is covered separately above.
    needs: debian-upgrade
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: Download the tested Debian package
        uses: actions/download-artifact@v4
        with:
          name: dcc-v1.3.12-linux
          path: release
      - name: Upgrade existing v1.3.10 install on Debian Bookworm and preserve profile/settings
        run: |
          apt-get update
          apt-get install -y ca-certificates curl desktop-file-utils xvfb xauth fonts-dejavu-core
          DCC_OLD_VERSION=1.3.10 bash tests/linux_deb_upgrade_smoke.sh

  web-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Web dependencies and test
        run: |
          python -m pip install --disable-pip-version-check -r apps/dcc-web/requirements.txt
          python -m compileall -q apps/dcc-web
          python -m unittest discover -s apps/dcc-web/tests -v
          node apps/dcc-web/tests/frontend_unit.mjs
      - name: Build DCC Web cross-platform source archive
        id: web-source
        run: |
          python packaging/web/build_source_archive.py
          echo "version=$(tr -d '\r\n' < apps/dcc-web/VERSION)" >> "$GITHUB_OUTPUT"
      - name: Upload DCC Web source package
        uses: actions/upload-artifact@v4
        with:
          name: dcc-web-${{ steps.web-source.outputs.version }}-source
          path: release/DCC-Web-${{ steps.web-source.outputs.version }}-source.zip
          if-no-files-found: error
      - name: Build the candidate Web image
        run: docker build -f apps/dcc-web/Dockerfile -t dcc-web:release-candidate .
      - name: Verify encrypted Web upgrade and read-only host folder recreation
        run: |
          mkdir -p "$RUNNER_TEMP/dcc-ssh-fixture"
          printf %s 'synthetic mount fixture' > "$RUNNER_TEMP/dcc-ssh-fixture/qa-marker.txt"
          python apps/dcc-web/tests/docker_security_smoke.py --image dcc-web:release-candidate --mount-fixture "$RUNNER_TEMP/dcc-ssh-fixture"
      - name: Verify non-root access to the Docker socket and Compose
        run: |
          docker run --rm --cap-drop=ALL --cap-add=SETUID --cap-add=SETGID --security-opt=no-new-privileges:true --volume /var/run/docker.sock:/var/run/docker.sock dcc-web:release-candidate python -c 'import os,subprocess; assert os.geteuid()==10001, os.geteuid(); assert os.access("/var/run/docker.sock",os.R_OK|os.W_OK); subprocess.run(["docker","version","--format","{{.Server.Version}}"],check=True,capture_output=True,text=True); subprocess.run(["docker","compose","version"],check=True,capture_output=True,text=True); print("socket group, dropped UID and Compose OK")'
          docker run --rm dcc-web:release-candidate --self-check
      - name: Verify App Store first-start credentials and restart behavior
        shell: bash
        run: |
          set -euo pipefail
          container=dcc-web-first-run-smoke
          data_volume="${container}-data"
          cleanup() {
            status=$?
            trap - EXIT
            if [[ "$status" -ne 0 ]]; then
              docker inspect --format='state={{.State.Status}} exit={{.State.ExitCode}}' "$container" || true
              docker logs "$container" 2>&1 | sed -E 's/(password=)[^[:space:]]+/\1[REDACTED]/g' || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$data_volume" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT
          docker volume create "$data_volume" >/dev/null
          docker run -d --name "$container" \
            --volume "$data_volume:/data" \
            dcc-web:release-candidate >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$container" python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8789/login",timeout=2)' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$container" python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8789/login",timeout=2)' >/dev/null
          logs="$(docker logs "$container" 2>&1)"
          count="$(grep -c 'DCC_WEB_INITIAL_CREDENTIALS username=admin password=' <<< "$logs")"
          test "$count" -eq 1
          password="$(grep -Eo 'DCC_WEB_INITIAL_CREDENTIALS username=admin password=[A-Za-z0-9_-]+' <<< "$logs" | head -n1 | sed 's/.* password=//')"
          test "${#password}" -ge 24
          docker restart "$container" >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$container" python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8789/login",timeout=2)' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$container" python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8789/login",timeout=2)' >/dev/null
          test "$(docker logs "$container" 2>&1 | grep -c 'DCC_WEB_INITIAL_CREDENTIALS username=admin password=')" -eq 1
          echo "Fresh App Store container starts and keeps one generated admin credential across restart."
