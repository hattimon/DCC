name: Kiri 0.1.3 public catalog upgrade

on:
  push:
    branches: [codex/kiri-013-updater-smoke]

permissions:
  contents: read

jobs:
  upgrade:
    name: Updater public catalog · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install pinned Updater requirements
        run: python -m pip install -r apps/container-updater/requirements.txt
      - name: Upgrade the published Kiri image through DCC Updater
        env:
          PYTHONPATH: apps/container-updater:apps/kiri-manager:apps/kiri-manager/tests
          IMAGE_ARCH: ${{ matrix.arch }}
        run: python apps/container-updater/tests/kiri_013_public_upgrade.py
