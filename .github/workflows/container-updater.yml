name: Build DCC Container Updater image

on:
  push:
    branches:
      - main
    paths:
      - "apps/container-updater/VERSION"
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the tested image from main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.publish-check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install app requirements
        run: python -m pip install -r apps/container-updater/requirements.txt
      - name: Run unit tests
        working-directory: apps/container-updater
        run: python -m unittest discover -s tests -v

      - name: Verify the Updater runtime image
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          docker build --pull --tag dcc-updater:ci apps/container-updater
          docker run --rm --network none --entrypoint sh dcc-updater:ci -ec \
            'docker-compose version && python -m pip check && python -c "import file_storage" && ! command -v curl'

      - name: Verify image-default update and persistent-volume retention with Docker
        working-directory: apps/container-updater
        run: python tests/docker_image_defaults_smoke.py

      - name: Verify managed HTTPS Web update and rollback with Docker
        working-directory: apps/container-updater
        run: python tests/docker_web_https_smoke.py

      - name: Verify Web update and rollback with managed Remote Access
        working-directory: apps/container-updater
        run: |
          python tests/docker_web_https_smoke.py \
            --old-image ghcr.io/hattimon/dcc-web:0.2.4 \
            --target-image ghcr.io/hattimon/dcc-web:0.2.5 \
            --expected-version 0.2.5 --with-remote-access

      - name: Publish only a new application version
        id: publish-check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PUBLISH_IMAGE: ${{ inputs.publish_image }}
        run: |
          bash tools/ci/updater-publish-decision.sh "$EVENT_NAME" "$EVENT_BEFORE" "$PUBLISH_IMAGE" >> "$GITHUB_OUTPUT"

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && needs.test.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read updater version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < apps/container-updater/VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/hattimon/dcc-container-updater
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: apps/container-updater
          file: apps/container-updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-updater
          cache-to: type=gha,mode=max,scope=container-updater
