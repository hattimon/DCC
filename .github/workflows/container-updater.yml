name: Build DCC Container Updater image

on:
  push:
    branches:
      - main
    paths:
      - "apps/container-updater/**"
      - ".github/workflows/container-updater.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app requirements
        run: python -m pip install -r apps/container-updater/requirements.txt
      - name: Run unit tests
        working-directory: apps/container-updater
        run: python -m unittest discover -s tests -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hattimon/dcc-container-updater
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: apps/container-updater
          file: apps/container-updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-updater
          cache-to: type=gha,mode=max,scope=container-updater
