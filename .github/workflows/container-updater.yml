name: Build DCC Container Updater image

on:
  push:
    branches:
      - main
    paths:
      - "apps/container-updater/**"
      - ".github/workflows/container-updater.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/container-updater/**"
      - ".github/workflows/container-updater.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.publish-check.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install app requirements
        run: python -m pip install -r apps/container-updater/requirements.txt
      - name: Run unit tests
        working-directory: apps/container-updater
        run: python -m unittest discover -s tests -v

      - name: Verify image-default update and persistent-volume retention with Docker
        working-directory: apps/container-updater
        run: python tests/docker_image_defaults_smoke.py

      - name: Verify managed HTTPS Web update and rollback with Docker
        working-directory: apps/container-updater
        run: python tests/docker_web_https_smoke.py

      - name: Verify Web update and rollback with managed Remote Access
        working-directory: apps/container-updater
        run: |
          python tests/docker_web_https_smoke.py \
            --old-image ghcr.io/hattimon/dcc-web:0.2.4 \
            --target-image ghcr.io/hattimon/dcc-web:0.2.5 \
            --expected-version 0.2.5 --with-remote-access

      - name: Publish only a new application version
        id: publish-check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          current="$(tr -d '\r\n' < apps/container-updater/VERSION)"
          previous=""
          if [[ "$EVENT_BEFORE" =~ ^[0-9a-f]{40}$ ]] && [[ "$EVENT_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            previous="$(git show "$EVENT_BEFORE:apps/container-updater/VERSION" 2>/dev/null | tr -d '\r\n' || true)"
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$previous" || "$current" != "$previous" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "VERSION is unchanged; tests ran, but published image tags will not be moved."
          fi

  publish:
    needs: test
    if: github.event_name != 'pull_request' && needs.test.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Read updater version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < apps/container-updater/VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hattimon/dcc-container-updater
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: apps/container-updater
          file: apps/container-updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-updater
          cache-to: type=gha,mode=max,scope=container-updater
