name: Maintain DCC application catalog

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-existing-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh upstream release metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/update_catalog_metadata.py

      - name: Publish metadata changes
        shell: bash
        run: |
          if git diff --quiet -- dcc-catalog.json; then
            echo "No upstream release changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dcc-catalog.json
          git commit -m "chore(catalog): refresh upstream releases"
          git push origin HEAD:main

  discover-candidates:
    needs: refresh-existing-apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover self-hosted candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/update_catalog_metadata.py --skip-metadata --discover

      - name: Create or update review branch
        id: candidate_changes
        shell: bash
        run: |
          if git diff --quiet -- catalog/candidates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/catalog-candidates
          git add catalog/candidates.json
          git commit -m "chore(catalog): refresh discovery candidates"
          git push --force-with-lease origin automation/catalog-candidates

      - name: Open candidate review PR
        if: steps.candidate_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh pr list --head automation/catalog-candidates --base main --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --base main \
              --head automation/catalog-candidates \
              --title "Catalog: review newly discovered container apps" \
              --body "Automated discovery refreshed catalog/candidates.json. Review sources, Docker installation requirements, mounts, privileges, persistence and ports before promoting any candidate to dcc-catalog.json."
          fi
