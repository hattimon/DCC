name: Maintain DCC application catalog

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: Check the catalog without opening pull requests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dcc-catalog-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.preview)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - kind: metadata
            file: dcc-catalog.json
          - kind: candidates
            file: catalog/candidates.json
    env:
      CATALOG_KIND: ${{ matrix.kind }}
      CATALOG_FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Refresh catalog data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "$CATALOG_KIND" == metadata ]]; then
            python tools/update_catalog_metadata.py
          else
            python tools/update_catalog_metadata.py --skip-metadata --discover
          fi
          python -m unittest discover -s tests -p test_catalog_identity.py -q
          python -m json.tool "$CATALOG_FILE" >/dev/null
      - name: Open a catalog pull request
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || !inputs.preview)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- "$CATALOG_FILE"; then
            echo "The catalog is current."
            exit 0
          fi
          prefix="automation/catalog-$CATALOG_KIND"
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?base=main&state=open&per_page=100" |
            jq -sr --arg prefix "$prefix" --arg repo "$GITHUB_REPOSITORY" '
              [ .[][] | select(.head.repo.full_name == $repo)
                | select(.head.ref == $prefix or (.head.ref | startswith($prefix + "-"))) ] | length')"
          if [[ "$existing" != 0 ]]; then
            echo "This part of the catalog already has a pull request awaiting review."
            exit 0
          fi
          branch="$prefix-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$CATALOG_FILE"
          git commit -m "chore(catalog): refresh $CATALOG_KIND"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "Catalog: refresh $CATALOG_KIND" \
            --body "The scheduled catalog job refreshed $CATALOG_FILE. Review upstream versions, sources and installation requirements before merging. Approve the CI run from the PR if GitHub requests it."
