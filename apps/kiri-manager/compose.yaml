services:
  panel:
    image: ghcr.io/hattimon/dcc-kiri-manager:0.1.0
    container_name: dcc-kiri-manager
    ports:
      - "127.0.0.1:${KIRI_PANEL_HOST_PORT:-8796}:8796"
    volumes:
      - data:/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    pids_limit: 40
    mem_limit: 192m
    restart: unless-stopped
volumes:
  data:
    name: dcc_kiri_manager_data
