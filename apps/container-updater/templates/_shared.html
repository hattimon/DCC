{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'cube' %}<path d="m12 3 9 5v8l-9 5-9-5V8l9-5Z M3 8l9 5 9-5 M12 13v8 M7.5 5.5l9 5"/>
{% elif name == 'refresh' %}<path d="M20 7v5h-5 M4 17v-5h5 M5.2 8a7 7 0 0 1 11.5-3L20 8 M4 16l3.3 3A7 7 0 0 0 18.8 16"/>
{% elif name == 'download' %}<path d="M12 3v12 m-5-5 5 5 5-5 M4 16v5h16v-5"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif name == 'shield' %}<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z M12 8v5 M12 16h.01"/>
{% elif name == 'arrow' %}<path d="M7 17 17 7 M7 7h10v10"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3 M12 14v3"/>
{% endif %}</svg>
{%- endmacro %}
{% macro language_picker(ui, lang, csrf_token) -%}
<form class="language-picker" method="post" action="{{ url_for('set_language') }}" aria-label="{{ ui.language }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button name="language" value="en" type="submit" lang="en" aria-label="English" aria-pressed="{{ 'true' if lang == 'en' else 'false' }}">EN</button><button name="language" value="pl" type="submit" lang="pl" aria-label="Polski" aria-pressed="{{ 'true' if lang == 'pl' else 'false' }}">PL</button></form>
{%- endmacro %}
{% macro footer(ui) -%}
<footer class="footer"><span>{{ ui.footer }}</span><a href="https://github.com/hattimon/DCC" target="_blank" rel="noopener noreferrer">{{ ui.repo }} {{ icon('arrow') }}</a></footer>
{%- endmacro %}
