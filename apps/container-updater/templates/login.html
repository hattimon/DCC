<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Logowanie · DCC Container Updater</title>
  <style>
    :root{color-scheme:dark;--bg:#101116;--panel:#191a21;--line:#414351;--accent:#ff405b;--text:#f3f3f6;--muted:#b6b7c2}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#29202a,var(--bg) 55%);font:15px/1.5 system-ui,Segoe UI,sans-serif;color:var(--text)}
    main{width:min(420px,100%);padding:28px;border:1px solid var(--line);border-radius:18px;background:#17171dee;box-shadow:0 18px 70px #0008}h1{font-size:23px;margin:0 0 6px}p{margin:0 0 20px;color:var(--muted)}label{display:block;margin:15px 0 6px}input,button{font:inherit;border-radius:10px}input{width:100%;padding:12px;background:#0e0f14;color:var(--text);border:1px solid var(--line)}input:focus{outline:2px solid var(--accent)}button{width:100%;margin-top:18px;padding:11px;background:var(--accent);color:#171116;border:0;font-weight:700;cursor:pointer}.message{color:#ffb1bb;min-height:24px}.mark{color:var(--accent);font-weight:800;letter-spacing:.08em;font-size:12px;margin-bottom:10px}
  </style>
</head>
<body>
  <main>
    <div class="mark">DCC · CONTAINER UPDATER</div>
    <h1>Zaloguj się</h1>
    <p>Podaj hasło wygenerowane przy pierwszym uruchomieniu. Znajdziesz je w logach kontenera.</p>
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="password">Hasło panelu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <div class="message" role="alert">{{ message }}</div>
      <button type="submit">Zaloguj</button>
    </form>
  </main>
</body>
</html>
